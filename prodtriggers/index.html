    <h1>Leitura de Triggers na pág externa no funil v4</h1>
    <!-- Cole o container abaixo no ponto exato em que o formulário deve aparecer -->
    <div
    data-cx-form-widget
    data-cx-mode="inline"
    data-cx-theme="dark"
    data-cx-title="Fale com nosso time"
    data-cx-description="Deixe seus dados e entraremos em contato."
    data-cx-submit-label="Enviar"
    data-cx-accent="#8B5CF6"
    data-cx-fields="name,email,telephone"
    data-cx-required-fields="email,telephone"
    data-cx-show-lgpd="true"
    data-cx-lgpd-required="true"></div>
        <!-- Botão que avança para a próxima etapa do funil -->
    <button class="cm-checkout-button">Comprar agora</button>
    <!-- ...ou, sem trocar a classe existente: -->

    <!-- Link que avança para a próxima etapa -->
    <a href="#" class="cm-next-funnel-node">Continuar</a>
    <!-- ...ou: -->
    <a href="#" data-cx-track="link">Continuar</a>

    <!-- Formulário que captura o contato e avança -->
    <form class="cm-form">
    <input name="email" type="email" />
    <button type="submit">Quero participar</button>
    </form>
